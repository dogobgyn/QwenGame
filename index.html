let turretPool={BASIC:4,TRISHOT:0,FREEZE:0,SNIPER:0,HOMING:0,RAILGUN:0};

function drawTurretPoolHUD(){
  turretPoolG.textContent='';
  if(phase!=='place'&&phase!=='preAttack')return;
  const entries=TURRET_TYPES.filter(t=>turretPool[t]>0);
  if(entries.length===0)return;
  turretPoolG.setAttribute('opacity',1);

  const iconSize=24,txtScale=0.9,gap=26;
  // Build each item: icon (art scaled to exactly iconSize, top-left at 0,0)
  // plus count text to the RIGHT of the icon, vertically centered.
  const items=entries.map(type=>{
    const txt=buildText('x'+turretPool[type],txtScale,2,'#ff2140');
    return{type,txt,w:iconSize+6+txt.w};
  });
  const totalW=items.reduce((s,it)=>s+it.w,0)+gap*(items.length-1);
  let curX=D/2-totalW/2;
  // Sit in the free band between heartshot HUD (870..892) and instructions (930)
  const baseY=GY0+GRID_SIDE+48; // 898

  for(const it of items){
    const g=el('g',{transform:`translate(${curX} ${baseY})`},turretPoolG);
    const ig=el('g',{transform:`scale(${iconSize/CELL})`},g);
    buildTurretArt(ig,it.type,CELL);
    const textY=(iconSize-LH*txtScale)/2;
    it.txt.g.setAttribute('transform',`translate(${iconSize+6} ${textY})`);
    g.appendChild(it.txt.g);
    curX+=it.w+gap;
  }
}

function pickTurretFromPool(){
  const entries=[];
  for(const t of TURRET_TYPES)for(let i=0;i<turretPool[t];i++)entries.push(t);
  if(entries.length===0)return'BASIC';
  return entries[(Math.random()*entries.length)|0];
}

function addUpgradesToPool(types){
  for(const t of types)turretPool[t]=(turretPool[t]||0)+1;
  drawTurretPoolHUD();
}

/* ======================== UPGRADE CONTAINERS ======================== */
const UPGRADE_CELLS=[{x:3,y:3},{x:13,y:3},{x:3,y:13},{x:13,y:13}];
let upgradeContainers=[];

function spawnUpgradeContainers(){
  upgradeContainersG.textContent='';
  upgradeContainers=[];
  const upgraded=TURRET_TYPES.filter(t=>t!=='BASIC');
  for(const c of UPGRADE_CELLS){
    const rewards=[];
    for(let i=0;i<3;i++)rewards.push(upgraded[(Math.random()*upgraded.length)|0]);
    const g=el('g',{transform:`translate(${cellX(c.x)} ${cellY(c.y)})`},upgradeContainersG);
    const s=CELL;
    el('rect',{x:s*0.1,y:s*0.4,width:s*0.8,height:s*0.5,fill:'#6d4c41',stroke:'#3e2723','stroke-width':2},g);
    el('path',{d:`M${s*0.1} ${s*0.4} Q${s*0.5} ${s*0.1} ${s*0.9} ${s*0.4} Z`,fill:'#8d6e63',stroke:'#3e2723','stroke-width':2},g);
    el('rect',{x:s*0.3,y:s*0.4,width:s*0.08,height:s*0.5,fill:'#ffca28',stroke:'#3e2723','stroke-width':1},g);
    el('rect',{x:s*0.62,y:s*0.4,width:s*0.08,height:s*0.5,fill:'#ffca28',stroke:'#3e2723','stroke-width':1},g);
    el('circle',{cx:s*0.5,cy:s*0.45,r:s*0.06,fill:'#ffca28',stroke:'#3e2723','stroke-width':1.5},g);
    upgradeContainers.push({cell:c,el:g,collected:false,rewards});
  }
}

function checkUpgradeCollection(r,c){
  for(const uc of upgradeContainers){
    if(uc.collected)continue;
    const dx=Math.abs(uc.cell.x-c),dy=Math.abs(uc.cell.y-r);
    if(dx+dy===1){
      uc.collected=true;
      uc.el.setAttribute('opacity',0);
      burst(cellX(uc.cell.x)+CELL/2,cellY(uc.cell.y)+CELL/2,'#a45cff',1.5);
      shockRing(cellX(uc.cell.x)+CELL/2,cellY(uc.cell.y)+CELL/2,CELL,'#a45cff',0.5);
      addUpgradesToPool(uc.rewards);
      showToast(['UPGRADE ACQUIRED!',uc.rewards.join(', ')]);
    }
  }
}

          if(s.hp<=0)destroyStruct(s);
        }else{
          s.freezeEl.setAttribute('opacity',0);
        }
      }
    }

    if(s.cool>0){
      if(tt==='RAILGUN'){s.railCharging=false;s.railChargeT=0;}
      continue;
    }
    if(!turretHasTarget(s)){
      if(tt==='RAILGUN'){s.railCharging=false;s.railChargeT=0;}
      continue;
    }

    if(tt==='BASIC'){
      s.cool=CFG.TURRET_RATE;
      const dx=Math.cos(s.angle),dy=Math.sin(s.angle);
      bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'BASIC',el:el('circle',{r:0.09*CELL,fill:'#111'},bulletG)});
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }else if(tt==='TRISHOT'){
      s.cool=CFG.TURRET_RATE;
      for(const offset of[-Math.PI/4,0,Math.PI/4]){
        const ang=s.angle+offset;
        const dx=Math.cos(ang),dy=Math.sin(ang);
        bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'BASIC',el:el('circle',{r:0.09*CELL,fill:'#ffe066'},bulletG)});
      }
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }else if(tt==='SNIPER'){
      s.cool=CFG.TURRET_RATE;
      if(s.beamEl){s.beamEl.setAttribute('stroke','#fff');s.beamEl.setAttribute('opacity',0.9);}
      const dx=Math.cos(s.angle),dy=Math.sin(s.angle);
      bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'SNIPER',dmg:2,el:el('circle',{r:0.06*CELL,fill:'#ff2140'},bulletG)});
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }else if(tt==='HOMING'){
      s.cool=CFG.TURRET_RATE;
      const dx=Math.cos(s.angle),dy=Math.sin(s.angle);
      const mg=el('g',{},bulletG);
      el('polygon',{points:`0,-3 8,0 0,3`,fill:'#ff6f00',stroke:'#111','stroke-width':0.5,transform:`scale(${CELL*0.04})`},mg);
      bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'HOMING',el:mg});
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }else if(tt==='RAILGUN'){
      if(!s.railCharging){
        s.railCharging=true;
        s.railChargeT=0;
        continue;
      }
      s.railChargeT+=dt;
      if(s.railChargeT<CFG.RAILGUN_CHARGE)continue;
      s.railCharging=false;s.railChargeT=0;
      s.cool=CFG.RAILGUN_RELOAD;
      if(s.beamEl){s.beamEl.setAttribute('stroke','#fff');s.beamEl.setAttribute('opacity',1);}
      const dx=Math.cos(s.angle),dy=Math.sin(s.angle);
      for(const a of aliens){
        if(a.state==='dying')continue;
        const ax=a.x-cx,ay=a.y-cy;
        const proj=ax*dx+ay*dy;
        if(proj<0||proj>CFG.BULLET_RANGE)continue;
        const perp=Math.abs(-ax*dy+ay*dx);
        if(perp<0.35)damageAlien(a,2);
      }
      shockRing(cellX(cx)+Math.cos(s.angle)*CELL*CFG.BULLET_RANGE*0.5,cellY(cy)+Math.sin(s.angle)*CELL*CFG.BULLET_RANGE*0.5,CELL*0.5,'#66bb6a',0.3);
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }
  }
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const speed=b.type==='HOMING'?CFG.BULLET_SPEED*0.8:CFG.BULLET_SPEED;
    const maxRange=b.type==='SNIPER'?CFG.BULLET_RANGE*2.5:b.type==='HOMING'?CFG.BULLET_RANGE*1.5:CFG.BULLET_RANGE;
    const dmg=b.dmg||1;

    if(b.type==='HOMING'){
      let bestDist=Infinity,bestA=null;
      for(const a of aliens){if(a.state==='dying')continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bestDist){bestDist=d;bestA=a;}}
      if(bestA){
        const want=Math.atan2(bestA.y-b.y,bestA.x-b.x);
        const cur=Math.atan2(b.dy,b.dx);
        const steer=angNorm(want-cur);
        const newAng=cur+clamp(steer,-4*dt,4*dt);
        b.dx=Math.cos(newAng);b.dy=Math.sin(newAng);
        if(b.el)b.el.setAttribute('transform',`translate(${cellX(b.x)} ${cellY(b.y)}) rotate(${newAng*180/Math.PI})`);
      }
    }

    const step=speed*dt;
    b.x+=b.dx*step;b.y+=b.dy*step;b.dist+=step;
    let dead=b.dist>=maxRange;

    if(!dead){
      for(const a of aliens){
        if(a.state==='dying')continue;
        if(Math.hypot(a.x-b.x,a.y-b.y)<CFG.ALIEN_HIT_RADIUS){damageAlien(a,dmg);dead=true;bulletHitFlicker(cellX(b.x),cellY(b.y));break;}
      }
    }
    if(dead){
      b.el.remove();bullets.splice(i,1);continue;
    }
    if(b.type!=='HOMING'){
      b.el.setAttribute('cx',cellX(b.x));b.el.setAttribute('cy',cellY(b.y));
    }
  }
}

function updateTooltip(){

  if(phase==='place'&&G.choices.length>0&&choicesG._op>0.5){

      const lines=['BUILD ADJACENT TO LOOT.',...data.rewards];

    updateGameOver(dt);
  }
  else{
    setBg(255);gOp=0.15;heartOp=1;hx=HEART_CELL_PX.x;hy=HEART_CELL_PX.y;
    hs=HEART_CELL_SCALE*(1+PULSE_AMP*beat*(heartHp/CFG.HEART_HP));
    if(heartShake>0){heartShake-=dt;hx+=(Math.random()-0.5)*2.4;hy+=(Math.random()-0.5)*2.4;}
    heartP.setAttribute('fill','#ff2140');heartP.setAttribute('stroke','#d40f33');
    haloP.setAttribute('opacity',(0.10+0.09*beat*(heartHp/CFG.HEART_HP)).toFixed(3));
    if(phase==='waiting'){G.timer-=dt;if(G.timer<=0){drawHeartshotsHUD();startWave(1);}}
    else if(phase==='banner')updateBanner(dt);
    else if(phase==='place'){updatePlacement(dt);updateProjectiles(dt);}
    else if(phase==='preAttack'){updatePlacement(dt);updateProjectiles(dt);G.timer-=dt;if(G.timer<=0)startAttack();}
    else if(phase==='attack')updateAttack(dt,t);
    else if(phase==='inter'){updateBullets(dt);updateProjectiles(dt);G.timer-=dt;if(G.timer<=0)startWave(G.wave+1);}
    if(phase==='place'||phase==='preAttack'||phase==='attack'||phase==='inter'){updateTurrets(dt);updateSelRing(beat);}
  }
  updateFx(dt);updateToasts(dt);updateDmgNumbers(dt);updateTooltip();
  gridG.setAttribute('opacity',gOp);
  borderG.setAttribute('opacity',gOp); // Fade in border with grid
  heartG.setAttribute('opacity',heartOp);
  heartG.setAttribute('transform',`translate(${hx} ${hy}) scale(${hs})`);
  requestAnimationFrame(frame);
}
buildTitle();buildGridLines();buildBtn();buildGameOverScreen();fitViewport();drawHeartshotsHUD();requestAnimationFrame(frame);
</script>
</body>
</html>
