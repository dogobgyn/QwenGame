const SFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  play(type, vol) {
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const now = this.ctx.currentTime;
    switch(type) {
      case 'shoot': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
        break;
      }
      case 'freeze': {
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.15, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 2000;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start(now);
        break;
      }
      case 'flame': {
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.18, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 700;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start(now);
        break;
      }
      case 'homing': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
        break;
      }
      case 'alienSpawn': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
        break;
      }
      case 'alienDie': {
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/data.length);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start(now);
        break;
      }
      case 'heartHit': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(60, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
        break;
      }
      case 'place': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
        break;
      }
      case 'upgrade': {
        for (let i = 0; i < 3; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 + i * 200, now + i * 0.08);
          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.08, now + i * 0.08 + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.15);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.15);
        }
        break;
      }
      case 'heartshot': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);

        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.3, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/data.length);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.15, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        noise.connect(nGain).connect(this.ctx.destination);
        noise.start(now);
        break;
      }
      case 'click': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1000, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.02);
        break;
      }
      case 'jumperShot': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
        break;
      }
      case 'gameOver': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 1.5);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.5);
        break;
      }
      case 'heartbeat': {
        const v = vol !== undefined ? vol : 0.45;
        const t = now;
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(60, t);
        osc1.frequency.exponentialRampToValueAtTime(30, t + 0.15);
        gain1.gain.setValueAtTime(v, t);
        gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc1.connect(gain1).connect(this.ctx.destination);
        osc1.start(t);
        osc1.stop(t + 0.15);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(50, t + 0.2);
        osc2.frequency.exponentialRampToValueAtTime(25, t + 0.35);
        gain2.gain.setValueAtTime(0, t);
        gain2.gain.setValueAtTime(v * 0.8, t + 0.2);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc2.connect(gain2).connect(this.ctx.destination);
        osc2.start(t + 0.2);
        osc2.stop(t + 0.35);
        break;
      }
      case 'titleChime': {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const t0 = now + i * 0.1;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.08, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.4);
          });
        break;
      }
      case 'waveChime': {
        const notes = [392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const t0 = now + i * 0.08;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(0.1, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.3);
          });
        break;
      }
      case 'bossChime': {
        const notes = [82.41, 77.78, 73.42, 69.30];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + i * 0.16);
            gain.gain.setValueAtTime(0.12, now + i * 0.16);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.9);
            osc.connect(gain).connect(this.ctx.destination);
            osc.start(now + i * 0.16);
            osc.stop(now + i * 0.16 + 0.9);
          });

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(58, now);
        osc.frequency.exponentialRampToValueAtTime(29, now + 1.4);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.4);
        break;
      }
      case 'mine': {
        const t = now;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, t);
        osc.frequency.exponentialRampToValueAtTime(25, t + 0.5);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.5);

        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.4, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/data.length);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 1000;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.3, t);
        nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        noise.connect(lp).connect(nGain).connect(this.ctx.destination);
        noise.start(t);

        for (let i = 0; i < 3; i++) {
          const zo = this.ctx.createOscillator();
          const zg = this.ctx.createGain();
          zo.type = 'square';
          const zt = t + 0.05 + i * 0.09;
          zo.frequency.setValueAtTime(900 + Math.random() * 600, zt);
          zo.frequency.exponentialRampToValueAtTime(200, zt + 0.08);
          zg.gain.setValueAtTime(0.06, zt);
          zg.gain.exponentialRampToValueAtTime(0.001, zt + 0.08);
          zo.connect(zg).connect(this.ctx.destination);
          zo.start(zt);
          zo.stop(zt + 0.08);
        }
        break;
      }
      case 'cannon': {
        const t = now;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, t);
        osc.frequency.exponentialRampToValueAtTime(25, t + 0.4);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.35, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 500;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.25, t);
        nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        noise.connect(lp).connect(nGain).connect(this.ctx.destination);
        noise.start(t);
        break;
      }
    }
  }
};

        shockRing(px, py, 2.2 * CELL, '#8b0000', 0.5);

        a.glideDist = 0;
        a.turretHp = DARKHEART_TURRET_HP;
        a.dhPhase = 'turretGlide'; a.dhT = 0;
      }
    }
  } else if (a.dhPhase === 'turretGlide') {

    a.y = clamp(a.y + a.glideDir.y * step, 0.5, GRID_N - 0.5);
    a.glideDist += step;

    a.vulnerable = false;

  return false;
}

function fireDarkHeartShot(x, y) {

  const g = el('g', {}, bulletG);
  el('path', {d: HEART_D, fill: '#0a0a0a', stroke: '#5c0000', 'stroke-width': 4}, g);
  dhShots.push({x, y, dx, dy, hp: DARKHEART_SHOT_HP, el: g, frozen: 0, rot: Math.random() * 360});
  SFX.play('jumperShot');
}

function updateDarkHeartShots(dt) {
  const hx = HEART.x + 0.5, hy = HEART.y + 0.5;
  for (let i = dhShots.length - 1; i >= 0; i--) {
    const s = dhShots[i];
    if (s.frozen > 0) s.frozen -= dt;
    const step = DH_SHOT_SPEED * dt * (s.frozen > 0 ? 0.34 : 1);
    s.x += s.dx * step; s.y += s.dy * step;
    s.rot += DH_SHOT_SPIN * dt;
    let dead = false;
    if (Math.hypot(hx - s.x, hy - s.y) < 0.35) {
      hurtHeart(CFG.HEART_HP * 0.08);
      heartShake = 0.2;
      burst(HEART_CELL_PX.x, HEART_CELL_PX.y, '#3d0000', 1.0);
      shockRing(HEART_CELL_PX.x, HEART_CELL_PX.y, CELL * 1.2, '#8b0000', 0.4);
      dead = true;
    }
    if (!dead) {
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.hypot(b.x - s.x, b.y - s.y) < 0.45) {
          s.hp -= b.dmg;
          bulletHitFlicker(cellX(s.x), cellY(s.y));
          b.el.remove(); bullets.splice(j, 1);
          if (s.hp <= 0) {
            burst(cellX(s.x), cellY(s.y), '#5c0000', 1.2);
            shockRing(cellX(s.x), cellY(s.y), CELL * 0.8, '#8b0000', 0.3);
            dead = true;
          }
          break;
        }
      }
    }
    if (!dead && (s.x < -2 || s.x > GRID_N + 2 || s.y < -2 || s.y > GRID_N + 2)) dead = true;
    if (dead) { s.el.remove(); dhShots.splice(i, 1); continue; }
    s.el.querySelector('path').setAttribute('stroke', s.frozen > 0 ? '#0288d1' : '#5c0000');
    s.el.setAttribute('transform', `translate(${cellX(s.x)} ${cellY(s.y)}) rotate(${s.rot.toFixed(1)}) scale(${0.34 * CELL / 56})`);
  }
}

function turretHasTarget(s){
  const tt=s.turretType||'BASIC';
  const cx=s.c+0.5,cy=s.r+0.5;
  const flameRange=2.5*(turretLevels.FLAME>=2?1.5:1);
  const range=tt==='SNIPER'?CFG.BULLET_RANGE*2.5:tt==='HOMING'?CFG.BULLET_RANGE*1.5:tt==='FLAME'?flameRange:CFG.BULLET_RANGE;
  const detRange = range + 1.5;
  for(const a of aliens){
    if(a.state==='dying')continue;
    const dx=a.x-cx,dy=a.y-cy,dist=Math.hypot(dx,dy);
    if(dist>detRange)continue;

  }

function flameHasProjTarget(cx, cy, range, angle) {
  for (const sh of dhShots) {
    const dx = sh.x - cx, dy = sh.y - cy;
    if (Math.hypot(dx, dy) <= range && Math.abs(angNorm(Math.atan2(dy, dx) - angle)) < 0.4) return true;
  }
  for (const cb of tankCannonballs) {
    const dx = cb.x - cx, dy = cb.y - cy;
    if (Math.hypot(dx, dy) <= range && Math.abs(angNorm(Math.atan2(dy, dx) - angle)) < 0.4) return true;
  }
  return false;
}

function startAttack(){
  phase='attack';svg.style.cursor='default';attackElapsed=0;G.spawned=0;G.gates=[];G.speedMult=1;for(const s of turrets)s.cool=CFG.TURRET_RATE;
  const isBossWave=(G.wave%5===0);
  const waveInCycle=((G.wave-1)%5)+1;
  const numPortals=bossesDefeated+waveInCycle;
  const cells=pickEdgeCells(numPortals);
  let nextOpen=0.9;
  for(let p=0;p<numPortals;p++){
    const openTime=nextOpen;
    nextOpen+=2+Math.random();
    const spawnQueue=[];
    let rareUsed=false;
    for(let k=0;k<CFG.ALIENS_PER_PORTAL;k++){
      let type=getAlienTypeForWave(G.wave,!rareUsed);
      if(type==='jumper'||type==='flyer'||type==='strong')rareUsed=true;
      spawnQueue.push({time:openTime+k*CFG.SPAWN_GAP_BASE,type});
    }
    G.gates.push({cell:cells[p%cells.length],el:makeGateArt(1),openTime,opened:false,spawnQueue,closing:false,closeT:0,size:1,boss:false,bossSpawned:false});
  }
  if(isBossWave && G.gates.length>=3){
    const gt=G.gates[2];
    gt.boss=true;
    if(G.wave===10)gt.cell={x:1,y:1};
    gt.size=3;
    gt.spawnQueue=[];
    gt.el.remove();
    gt.el=makeGateArt(3);
    G.total=(numPortals-1)*CFG.ALIENS_PER_PORTAL+1;
  }else{
    G.total=numPortals*CFG.ALIENS_PER_PORTAL;
  }
  showInstructions();
}
function makeGateArt(size){
  size=size||1;
  const g=document.createElementNS(NS,'g');
  const r1=size>1?0.7071:0.44;
  const r2=size>1?0.5:0.3;
  const sw1=size>1?0.02:0.05;
  const sw2=size>1?0.015:0.04;
  const sq=(r,sw)=>{const h=r/Math.SQRT2;return el('rect',{x:-h,y:-h,width:2*h,height:2*h,fill:'none',stroke:'#a45cff','stroke-width':sw},g);};
  sq(r1,sw1);sq(r2,sw2);
  gateG.appendChild(g);

}
function updateGates(dt,t){
  const at=attackElapsed;
  for(let gi=G.gates.length-1;gi>=0;gi--){
    const gt=G.gates[gi];
    if(!gt.opened&&at>=gt.openTime){gt.opened=true;}
    if(gt.boss&&gt.opened&&!gt.bossSpawned&&at>=gt.openTime+0.2){
      if (G.wave === 10) spawnTankBoss(gt.cell);
      else if (G.wave === 15) spawnDarkBoss(gt.cell);
      else if (G.wave === 20) spawnDarkHeartBoss(gt.cell);
      else spawnBoss(gt.cell);
      gt.bossSpawned=true;
      G.spawned++;
    }
    while(gt.spawnQueue.length&&at>=gt.spawnQueue[0].time){
      const spawn=gt.spawnQueue.shift();
      spawnAlien(gt.cell,spawn.type);
      SFX.play('alienSpawn');
      G.spawned++;
    }
    if(gt.opened&&!gt.spawnQueue.length&&!gt.closing&&(!gt.boss||gt.bossSpawned)){
      gt.closing=true;
    }
    let s=0;
    if(gt.opened){
      const age=at-gt.openTime;
      if(gt.closing){gt.closeT+=dt;s=1-easeInCubic(clamp01(gt.closeT/0.4));}
      else{s=easeOutCubic(clamp01(age/0.5));}
    }
    const px=cellX(gt.cell.x)+CELL/2,py=cellY(gt.cell.y)+CELL/2;
    const sc=CELL*(gt.size||1)*s;
    gt.el.setAttribute('transform',`translate(${px} ${py})`);
    gt.el.setAttribute('opacity',clamp01(s*1.2));
    if(gt.el.children[0])gt.el.children[0].setAttribute('transform',`rotate(${t*90}) scale(${sc})`);
    if(gt.el.children[1])gt.el.children[1].setAttribute('transform',`rotate(${-t*140}) scale(${sc})`);
    if(gt.closing&&gt.closeT>=0.45){gt.el.remove();G.gates.splice(gi,1);}
  }
}

function astar(start){const key=n=>n.x+','+n.y;const goal=n=>manh(n)===1;if(goal(start))return[start];const open=[{x:start.x,y:start.y,g:0,f:manh(start)}];const gS={},from={},closed={};gS[key(start)]=0;while(open.length){let bi=0;for(let i=1;i<open.length;i++)if(open[i].f<open[bi].f)bi=i;const cur=open.splice(bi,1)[0],ck=key(cur);if(closed[ck])continue;closed[ck]=1;if(goal(cur)){const path=[];let k=ck;while(k){const[px,py]=k.split(',').map(Number);path.unshift({x:px,y:py});k=from[k];}return path;}for(const n of neighborCells(cur)){if(!inGrid(n)||structAt(n)||(n.x===HEART.x&&n.y===HEART.y))continue;const nk=key(n);if(closed[nk])continue;const ng=cur.g+1;if(gS[nk]===undefined||ng<gS[nk]){gS[nk]=ng;from[nk]=ck;open.push({x:n.x,y:n.y,g:ng,f:ng+manh(n)});}}}return null;}

const KNIGHT_OFFSETS=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];

function fireJumperShot(a){
  const tx=HEART.x+0.5,ty=HEART.y+0.5;
  const d=Math.hypot(tx-a.x,ty-a.y)||1;
  const dx=(tx-a.x)/d,dy=(ty-a.y)/d;
  const elc=el('circle',{r:0.08*CELL,fill:'#ff2140',stroke:'#8b0000','stroke-width':1},bulletG);
  elc.setAttribute('cx',cellX(a.x));elc.setAttribute('cy',cellY(a.y));
  ebullets.push({x:a.x,y:a.y,dx,dy,dist:0,el:elc});
  burst(cellX(a.x)+dx*CELL*0.3,cellY(a.y)+dy*CELL*0.3,'#ff2140',0.4);
  SFX.play('jumperShot');
}
function updateEBullets(dt){
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    const step=CFG.JUMPER_SHOT_SPEED*dt;
    b.x+=b.dx*step;b.y+=b.dy*step;b.dist+=step;
    const tx=HEART.x+0.5,ty=HEART.y+0.5;
    const dh=Math.hypot(tx-b.x,ty-b.y);
    let dead=false;
    if(dh<0.3){
      hurtHeart(CFG.HEART_HP*0.05);
      heartShake=0.2;
      burst(HEART_CELL_PX.x,HEART_CELL_PX.y,'#ff2140',0.8);
      dead=true;
    }
    if(b.dist>8)dead=true;
    if(dead){b.el.remove();ebullets.splice(i,1);continue;}
    b.el.setAttribute('cx',cellX(b.x));b.el.setAttribute('cy',cellY(b.y));
  }
}

function decideJumper(a){
  if(manh(a.cell)<=1){
    a.state='attack';
    a.target={kind:'heart'};
    return;
  }
  if(manh(a.cell)<=CFG.JUMPER_SHOT_RANGE&&a.shootCool<=0){
    fireJumperShot(a);
    a.shootCool=CFG.JUMPER_SHOT_RATE;
  }
  const curManh=manh(a.cell);
  const freeCloser=(nx,ny)=>{
    if(nx<0||nx>=GRID_N||ny<0||ny>=GRID_N)return false;
    if(nx===HEART.x&&ny===HEART.y)return false;
    if(structAt({x:nx,y:ny}))return false;
    return manh({x:nx,y:ny})<curManh;
  };
  let target=null;
  const knights=[];
  for(const[dx,dy]of KNIGHT_OFFSETS){
    const nx=a.cell.x+dx,ny=a.cell.y+dy;
    if(freeCloser(nx,ny))knights.push({x:nx,y:ny});
  }
  if(knights.length)target=knights[(Math.random()*knights.length)|0];
  if(!target){
    const short=[];
    for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){
      if(!dx&&!dy)continue;
      const nx=a.cell.x+dx,ny=a.cell.y+dy;
      if(freeCloser(nx,ny))short.push({x:nx,y:ny});
    }
    if(short.length)target=short[(Math.random()*short.length)|0];
  }
  if(target){
    a.state='prepare';
    a.prepareT=0;
    a.pendingTo=target;
  }else{
    a.state='idle';
    a.wait=0.3;
  }
}

function decideFlyer(a){
  const tx=HEART.x+0.5,ty=HEART.y+0.5;
  const d=Math.hypot(tx-a.x,ty-a.y);
  if(d<=0.9){
    a.state='attack';
    a.target={kind:'heart'};
    return;
  }
  a.state='fly';
}

function decide(a){
  if(manh(a.cell)<=1&&a.alienType!=='flyer'){
    a.state='attack';
    a.target={kind:'heart'};
    return;
  }
  if(a.alienType==='jumper'||a.alienType==='darkhopper'){
    decideJumper(a);
    return;
  }
  if(a.alienType==='flyer'||a.alienType==='darkflyer'){
    decideFlyer(a);
    return;
  }
  if(!a.path||a.pathIdx>=a.path.length)requestPath(a);
  if(!a.breach){
    if(a.path&&a.pathIdx<a.path.length){
      const next=a.path[a.pathIdx];
      if(inGrid(next)&&!structAt(next)&&!(next.x===HEART.x&&next.y===HEART.y))startStep(a,next);
      else{a.state='idle';a.wait=0.25;a.path=null;}
    }else{a.path=null;a.state='idle';a.wait=0.1;}
  }else{
    const next=greedyStep(a.cell);
    if(next.x===a.cell.x&&next.y===a.cell.y){a.state='idle';a.wait=0.2;return;}
    if(structAt(next)){a.state='attack';a.target={kind:'struct',cell:next};}
    else startStep(a,next);
  }
}
function startStep(a,c){a.state='walk';a.from={...a.cell};a.to=c;a.mt=0;}
function damageAlien(a, amt) {
  if (a.state === 'dying') return false;
  if (a.alienType === 'darkheart') {
    if (a.dhPhase === 'turretGlide' || a.dhPhase === 'turretShoot') {
      a.turretHp -= amt;
      a.flash = 0.15;
      if (a.turretHp <= 0) {
        burst(cellX(a.x), cellY(a.y), '#8b0000', 2.0);
        shockRing(cellX(a.x), cellY(a.y), 2 * CELL, '#8b0000', 0.5);
        SFX.play('mine');
        a.dhPhase = 'emerge'; a.dhT = 0; a.vulnerable = false;
      }
      return false;
    }
    if (!a.vulnerable) { a.flash = 0.1; return false; }
    a.hp -= amt;
    a.flash = 0.15;
    drawBossMeter();
    if (a.hp <= 0) { killAlien(a); return true; }
    return false;
  }
  if ((a.alienType === 'boss' || a.alienType === 'darkboss') && !a.vulnerable) {
    a.flash = 0.1;
    return false;
  }
  a.hp-=amt;
  a.flash=0.15;
  if(a.alienType==='boss'||a.alienType==='tank')drawBossMeter();
  if(a.hp<=0){
    killAlien(a);
    return true;
  }
  return false;
}

function hurtHeart(amt){
  if(heartInvincible)return;
  heartHp-=amt;
  heartShake=0.15;
  SFX.play('heartHit');
  if(heartHp<=0&&!heartDead){heartHp=0;heartDead=true;phase='over';overT=0;hideTooltip();startHeartBreak();SFX.play('gameOver');}
}

function drawBossMeter(){
  bossHudG.textContent='';
  if(!boss || boss.state==='dying'){
    bossHudG.setAttribute('opacity',0);
    return;
  }
  bossHudG.setAttribute('opacity',1);
  const w=520,h=20,x=D/2-w/2,y=952;
  const label=buildText('BOSS',0.9,2.2,'#111');
  label.g.setAttribute('transform',`translate(${D/2-label.w/2} ${y-24})`);
  bossHudG.appendChild(label.g);
  el('rect',{x:x,y:y,width:w,height:h,rx:6,fill:'#fff',stroke:'#111','stroke-width':2},bossHudG);
  const frac=clamp01(boss.hp/boss.maxHp);
  if(frac>0){
    el('rect',{x:x+2,y:y+2,width:(w-4)*frac,height:h-4,rx:4,fill:'#ff2140'},bossHudG);
  }
}

function spawnBoss(cell){
  const cx=cell.x+0.5,cy=cell.y+0.5;
  const hx=HEART.x+0.5,hy=HEART.y+0.5;
  const dx=hx-cx,dy=hy-cy;
  const d=Math.hypot(dx,dy)||1;
  const x=cx+dx/d*1.0,y=cy+dy/d*1.0;
  const bossHp=cheatMode?10:ALIEN_HP.boss;
  aliens.push({
      x:x,y:y,
      cell:{x:clamp(Math.floor(x),0,GRID_N-1),y:clamp(Math.floor(y),0,GRID_N-1)},
      state:'bossEnter',t:0,aliveTime:0,
      speed:0,
      art:makeAlienArt('boss'),
      walkT:0,
      from:null,to:null,mt:0,
      target:null,flash:0,wait:0,lunge:0,
      path:null,pathIdx:0,distTraveled:0,
      breach:false,
      hp:bossHp,maxHp:bossHp,
      frozen:0,stunned:0,postStunFreeze:0,
      alienType:'boss',
      shootCool:0,
      bossPhase:'enter',bossT:0,spawnCount:0,
      vulnerable:false,eyeOpen:false,
      orbitAngle:Math.atan2(y-hy,x-hx),
      radius:clamp(Math.hypot(x-hx,y-hy),5,8),
      bobT:0,spin:0,heading:0,
    });
  boss=aliens[aliens.length-1];
  drawBossMeter();
}

function spawnFlyerAt(x,y,heading){
  const cell={x:clamp(Math.floor(x),0,GRID_N-1),y:clamp(Math.floor(y),0,GRID_N-1)};
  spawnAlien(cell,'flyer');
  const a=aliens[aliens.length-1];
  a.x=clamp(x,0.5,GRID_N-0.5);
  a.y=clamp(y,0.5,GRID_N-0.5);
  a.heading=heading;
  a.state='fly';
  a.t=0.4;
}

function spawnBossFlyers(count,b){
  const base=Math.atan2(HEART.y+0.5-b.y,HEART.x+0.5-b.x);
  for(let i=0;i<count;i++){
    const ang=base + i * Math.PI * 2 / Math.max(1,count);
    const sx=clamp(b.x+Math.cos(ang)*BOSS_RADIUS*0.9,0.5,GRID_N-0.5);
    const sy=clamp(b.y+Math.sin(ang)*BOSS_RADIUS*0.9,0.5,GRID_N-0.5);
    spawnFlyerAt(sx,sy,ang);
  }
}

function spawnBossDarkHoppers(count,b){
  const base=Math.atan2(HEART.y+0.5-b.y,HEART.x+0.5-b.x);
  for(let i=0;i<count;i++){
    const ang=base+i*Math.PI*2/Math.max(1,count);
    const sx=clamp(b.x+Math.cos(ang)*BOSS_RADIUS*0.9,0.5,GRID_N-0.5);
    const sy=clamp(b.y+Math.sin(ang)*BOSS_RADIUS*0.9,0.5,GRID_N-0.5);
    const cell={x:clamp(Math.floor(sx),0,GRID_N-1),y:clamp(Math.floor(sy),0,GRID_N-1)};
    spawnAlien(cell,'darkhopper');
    const a=aliens[aliens.length-1];
    a.x=sx;a.y=sy;
    a.state='idle';a.wait=0.3;
  }
}

function spawnGreenHeart(x,y){
  const pg=el('g',{},projG);
  const inner=el('g',{transform:`scale(${CELL*0.45/56})`},pg);
  el('path',{d:HEART_D,fill:'#39d353',stroke:'#1f8f3a','stroke-width':2},inner);
  greenHearts.push({el:pg,inner,srcX:cellX(x),srcY:cellY(y),t:0,dur:1.2});
}

function updateGreenHearts(dt){
  for(let i=greenHearts.length-1;i>=0;i--){
    const h=greenHearts[i];
    h.t+=dt;
    const p=clamp01(h.t/h.dur);
    const e=easeInOutCubic(p);
    const x=lerp(h.srcX,HEART_CELL_PX.x,e);
    const y=lerp(h.srcY,HEART_CELL_PX.y,e)-Math.sin(p*Math.PI)*CELL*2;
    h.el.setAttribute('transform',`translate(${x} ${y})`);
    h.inner.setAttribute('transform',`scale(${CELL*(0.45+0.15*p)/56}) rotate(${p*360})`);
    if(p>=1){
      h.el.remove();
      greenHearts.splice(i,1);
      if(!heartDead){
        heartHp=Math.min(CFG.HEART_HP,heartHp+CFG.HEART_HP*0.15);
        heartShake=0.2;
        burst(HEART_CELL_PX.x,HEART_CELL_PX.y,'#39d353',2.0);
        shockRing(HEART_CELL_PX.x,HEART_CELL_PX.y,2.5*CELL,'#39d353',0.5);
        if (bossesDefeated === 1) showToast(['UPGRADE: SECOND PIECE CHOICE']);
        else if (bossesDefeated === 2) { placementsPerWave = 4; showToast(['UPGRADE: 4 PIECES PER WAVE']); }
        else if (bossesDefeated === 3) { turretAdjacencyRemoved = true; showToast(['UPGRADE: TURRETS BUILD ADJACENT']); }
        else if (bossesDefeated === 4) triggerWinScreen();
      }
    }
  }
}

function updateBossAlien(a,dt,t){
  a.aliveTime+=dt;
  if(a.flash>0)a.flash-=dt*4;

  if(a.state==='dying'){
    a.t+=dt;
    const dur=1.6;
    a.boomAccum=(a.boomAccum||0)+dt;
    while(a.boomAccum>0.08){
      a.boomAccum-=0.08;
      const ox=a.x+(Math.random()-0.5)*BOSS_RADIUS*1.8;
      const oy=a.y+(Math.random()-0.5)*BOSS_RADIUS*1.8;
      burst(cellX(ox),cellY(oy),pick(['#ff8c42','#ffe066','#ff2140','#ffffff']),1.5+Math.random()*1.5);
      shockRing(cellX(ox),cellY(oy),(1+Math.random()*2)*CELL,pick(['#ff8c42','#ffe066']),0.4);
    }
    screenShake=Math.max(screenShake,0.15);
    a.y+=dt*(1/dur);
    const p=clamp01(a.t/dur);
    const sc=Math.max(0,1-easeInCubic(p));
    a.art.g.setAttribute('transform',`translate(${cellX(a.x)} ${cellY(a.y)}) scale(${CELL*sc}) rotate(${p*120})`);
    a.art.g.setAttribute('opacity',String(1-p));
    if(a.t>=dur){
      a.art.g.remove();
      spawnGreenHeart(a.x,a.y);
      return true;
    }
    return false;
  }

  const hx=HEART.x+0.5,hy=HEART.y+0.5;

  if(a.bossPhase==='enter'){
    a.t+=dt;
    const p=easeOutCubic(clamp01(a.t/1.0));
    if(p>=1){
      a.bossPhase='fly';
      a.bossT=0;
      a.spawnCount=0;
      a.vulnerable=false;
      a.eyeOpen=false;
      a.orbitAngle=Math.atan2(a.y-hy,a.x-hx);
      a.radius=clamp(Math.hypot(a.x-hx,a.y-hy),5,8);
      a.bobT=0;
    }
    a.art.g.setAttribute('transform',`translate(${cellX(a.x)} ${cellY(a.y)}) scale(${CELL*Math.max(0.001,p)})`);
    if(a.art.flashEl)a.art.flashEl.setAttribute('opacity',0);
    return false;
  }

  a.bossT+=dt;

  if(a.bossPhase==='fly'){
    a.eyeOpen=false;
    a.vulnerable=false;
    if(a.bossT>=3){
      a.bossPhase='open';
      a.bossT=0;
      a.eyeOpen=true;
      a.vulnerable=true;
      a.spawnCount=(a.spawnCount||0)+1;
      if(a.alienType==='darkboss')spawnBossDarkHoppers(a.spawnCount,a);
      else spawnBossFlyers(a.spawnCount,a);
    }
  }else if(a.bossPhase==='open'){
    a.eyeOpen=true;
    a.vulnerable=true;
    if(a.bossT>=4){
      a.bossPhase='fly';
      a.bossT=0;
      a.eyeOpen=false;
      a.vulnerable=false;
    }
  }

  const moving=a.bossPhase==='fly' || (a.bossPhase==='open'&&a.bossT>=2);
  if(moving){
    a.orbitAngle+=dt*0.5;
    a.bobT+=dt*0.7;
    const desiredRadius=5+3*(0.5+0.5*Math.sin(a.bobT));
    a.radius+=clamp(desiredRadius-a.radius,-2.5*dt,2.5*dt);
    const tx=hx+Math.cos(a.orbitAngle)*a.radius;
    const ty=hy+Math.sin(a.orbitAngle)*a.radius;
    const dx=tx-a.x,dy=ty-a.y;
    const d=Math.hypot(dx,dy)||1;
    const spd=3.0;
    const step=Math.min(spd*dt,d);
    a.x+=dx/d*step;
    a.y+=dy/d*step;
    a.x=clamp(a.x,BOSS_RADIUS,GRID_N-BOSS_RADIUS);
    a.y=clamp(a.y,BOSS_RADIUS,GRID_N-BOSS_RADIUS);
  }

  a.spin=(a.spin||0)+dt*(a.bossPhase==='open'?50:140);
  if(a.art.lightsG)a.art.lightsG.setAttribute('transform',`rotate(${(a.spin%360).toFixed(1)})`);
  if(a.art.eyeOpenEl)a.art.eyeOpenEl.setAttribute('opacity',a.eyeOpen?1:0);
  if(a.art.eyeClosedEl)a.art.eyeClosedEl.setAttribute('opacity',a.eyeOpen?0:1);

  let sc=1;
  if(a.flash>0)sc*=1.04;
  a.art.g.setAttribute('transform',`translate(${cellX(a.x)} ${cellY(a.y)}) scale(${CELL*sc})`);
  if(a.art.flashEl)a.art.flashEl.setAttribute('opacity',a.flash>0?0.4*(a.flash/0.15):0);

  return false;
}

function updateAliens(dt,t){
  for(let i=aliens.length-1;i>=0;i--){
    const a=aliens[i];

    if(a.alienType==='tank'){
      if(updateTankBoss(a,dt,t))aliens.splice(i,1);
      continue;
    }
    if(a.alienType==='boss'||a.alienType==='darkboss'){
      if(updateBossAlien(a,dt,t))aliens.splice(i,1);
      continue;
    }
    if (a.alienType === 'darkheart') {
      if (updateDarkHeartBoss(a, dt, t)) aliens.splice(i, 1);
      continue;
    }

    a.aliveTime+=dt;a.walkT+=dt*7;
    if(a.flash>0)a.flash-=dt*4;
    if(a.frozen>0)a.frozen-=dt;
    if(a.stunned>0){
      a.stunned-=dt;
      if(a.stunned<=0 && a.postStunFreeze>0){
        a.frozen=Math.max(a.frozen,a.postStunFreeze);
        a.postStunFreeze=0;
      }
    }
    if(a.shootCool>0)a.shootCool-=dt;
    const frozenMult=a.frozen>0?0.34:1;
    const typeMult=(a.alienType==='jumper'||a.alienType==='darkhopper')?CFG.JUMPER_SPEED_MULT:1;

    const cols=ALIEN_COLORS[a.alienType]||ALIEN_COLORS.normal;
    if(a.art.body){
      if(a.frozen>0){
        a.art.body.setAttribute('fill','#4fc3f7');
        a.art.body.setAttribute('stroke','#0288d1');
      }else if(a.breach&&(a.alienType==='normal'||a.alienType==='intermediate')){
        a.art.body.setAttribute('fill','#e63946');
        a.art.body.setAttribute('stroke','#8b0000');
      }else{
        a.art.body.setAttribute('fill',cols[0]);
        a.art.body.setAttribute('stroke',cols[1]);
      }
    }

    const indivMult=1+a.aliveTime*CFG.ALIEN_ACCEL;
    const isStunned=a.stunned>0&&a.state!=='dying';

    if(!isStunned){
      if(a.state==='spawn'){
        a.t+=dt;
        if(a.t>=0.4){a.state='idle';decide(a);}
      }else if(a.state==='walk'){
        a.mt+=dt*a.speed*indivMult*(a.breach?CFG.BREACH_SPEED_MULT:1)*frozenMult;
        if(a.mt>=1){
          a.cell={...a.to};
          a.distTraveled+=1;
          a.from=null;a.to=null;
          a.state='idle';
          if(!a.breach&&a.path&&a.pathIdx<a.path.length)a.pathIdx++;
          if(a.breach)a.path=null;
          decide(a);
        }
      }else if(a.state==='fly'){
        const tx=HEART.x+0.5,ty=HEART.y+0.5;
        const dx=tx-a.x,dy=ty-a.y;
        const d=Math.hypot(dx,dy)||1;
        if(d<=0.9){
          a.state='attack';
          a.target={kind:'heart'};
        }else{
          const want=Math.atan2(dy,dx);
          if(a.heading===undefined||a.heading===null)a.heading=want;
          const steer=angNorm(want-a.heading);
          a.heading=angNorm(a.heading+clamp(steer,-2*dt,2*dt));
          const v=a.speed*indivMult*frozenMult;
          a.x+=Math.cos(a.heading)*v*dt;
          a.y+=Math.sin(a.heading)*v*dt;
          a.cell={x:clamp(Math.floor(a.x),0,GRID_N-1),y:clamp(Math.floor(a.y),0,GRID_N-1)};
        }
      }else if(a.state==='prepare'){
        a.prepareT+=dt*frozenMult*typeMult;
        if(a.prepareT>=CFG.JUMPER_PAUSE){
          a.state='jumping';
          a.from={...a.cell};
          a.to=a.pendingTo;
          a.mt=0;a.jumpT=0;
        }
      }else if(a.state==='jumping'){
        a.jumpT+=dt*frozenMult*typeMult;
        const JUMP_DUR=0.5;
        a.mt=clamp01(a.jumpT/JUMP_DUR);
        if(a.mt>=1){
          a.cell={...a.to};
          a.from=null;
          a.to=null;
          a.state='idle';
          a.wait=0.2;
        }
      }else if(a.state==='idle'){
        if(a.wait>0){a.wait-=dt;if(a.wait<=0)decide(a);}
      }else if(a.state==='attack'){
        a.lunge+=dt*9*frozenMult;
        if(a.target.kind==='heart'){
          hurtHeart(CFG.GNAW_DMG*dt*frozenMult);
        }else{
          const s=structAt(a.target.cell);
          if(!s){a.target=null;a.state='idle';a.path=null;a.wait=0.05;decide(a);}
          else damageStruct(s,CFG.GNAW_DMG*dt*frozenMult);
        }
      }else if(a.state==='dying'){
        a.t+=dt;
        if(a.t>=0.4){a.art.g.remove();aliens.splice(i,1);continue;}
      }
    }

    let px=a.x,py=a.y;
    if(a.state==='walk'&&a.from){
      px=lerp(a.from.x+0.5,a.to.x+0.5,a.mt);
      py=lerp(a.from.y+0.5,a.to.y+0.5,a.mt);
      a.x=px;a.y=py;
    }
    if(a.state==='jumping'&&a.from){
      px=lerp(a.from.x+0.5,a.to.x+0.5,a.mt);
      py=lerp(a.from.y+0.5,a.to.y+0.5,a.mt);
      const arcHeight=0.5;
      py-=Math.sin(a.mt*Math.PI)*arcHeight;
      a.x=px;a.y=py;
    }

    const dxh=HEART.x+0.5-a.x,dyh=HEART.y+0.5-a.y,dh=Math.hypot(dxh,dyh)||1;
    let ox=0,oy=0;
    if(a.state==='attack'&&!isStunned){
      const k=Math.max(0,Math.sin(a.lunge))*0.08;
      ox=dxh/dh*k*CELL;oy=dyh/dh*k*CELL;
    }

    let sc=a.state==='spawn'?easeOutCubic(a.t/0.4):a.state==='dying'?1-easeInCubic(a.t/0.4):1;
    if(a.state==='prepare')sc*=1-0.18*clamp01(a.prepareT/CFG.JUMPER_PAUSE);
    if(a.state==='jumping')sc*=1+0.2*Math.sin(a.mt*Math.PI);
    if(a.flash>0)sc*=1.1;
    if(a.stunned>0)sc*=1+0.04*Math.sin(t*35+i);

    let walkBob=a.state==='walk'&&!isStunned?Math.sin(a.walkT)*0.03:0;
    a.art.g.setAttribute('transform',`translate(${cellX(px)+ox} ${cellY(py)+oy}) scale(${CELL*sc}) translate(0 ${walkBob})`);

    if(a.art.pup)a.art.pup.setAttribute('transform',`translate(${dxh/dh*0.03} ${dyh/dh*0.03})`);
    if(a.art.legs)a.art.legs.setAttribute('transform',`rotate(${Math.sin(a.walkT)*8})`);

    if(a.art.legsJump){
      const air=a.state==='jumping';
      a.art.legsJump.setAttribute('opacity',air?1:0);
      a.art.legsLand.setAttribute('opacity',air?0:1);
    }

    if((a.alienType==='flyer'||a.alienType==='darkflyer')&&a.art.rotG){
      const hd=a.heading!==undefined?a.heading:0;
      a.art.rotG.setAttribute('transform',`rotate(${(hd*180/Math.PI).toFixed(1)})`);
    }

    if((a.alienType==='flyer'||a.alienType==='darkflyer')&&a.art.wings){
      const flapAngle=Math.sin(t*20)*25;
      a.art.wings.setAttribute('transform',`rotate(${flapAngle})`);
    }

    a.art.g.setAttribute('opacity',1);
    a.art.flashEl.setAttribute('opacity',a.flash>0?0.7*(a.flash/0.15):0);

    if(a.art.stunG){
      if(a.stunned>0){
        a.art.stunG.setAttribute('opacity',1);
        a.art.stunG.setAttribute('transform',`rotate(${((t*160)%360).toFixed(1)})`);
      }else{
        a.art.stunG.setAttribute('opacity',0);
      }
    }

    updateAlienHPDisplay(a);
  }
}

function killAllEnemiesExcept(except){
  for(const other of aliens.slice()){
    if(other===except || other.state==='dying')continue;
    killAlien(other,true);
  }
}

function killAlien(a, purge=false){
  if(a.state==='dying')return;
  a.state='dying';a.t=0;aliensKilled++;
  SFX.play('alienDie');
  heartshots=Math.min(CFG.HEARTSHOT_MAX,heartshots+CFG.HEARTSHOT_GAIN);
  drawHeartshotsHUD();

  if(a.alienType==='boss'||a.alienType==='tank'||a.alienType==='darkboss'||a.alienType==='darkheart'){
    boss=null;
    drawBossMeter();
    bossesDefeated++;
    aliensKilled += Math.ceil(heartHp) * bossesDefeated;
    killAllEnemiesExcept(a);
    destroyAllStructures();

    for(const gt of G.gates)gt.el.remove();
    G.gates.length=0;
    G.total=G.spawned;

    for(const b of ebullets)b.el.remove();
    ebullets.length=0;

    for(const c of tankCannonballs)c.el.remove();
    tankCannonballs.length=0;
    for(const s of dhShots)s.el.remove();
    dhShots.length=0;

    screenShake=2.0;
    a.boomAccum=0;

    burst(cellX(a.x),cellY(a.y),'#ff8c42',4.0);
    burst(cellX(a.x),cellY(a.y),'#ff2140',3.0);
    burst(cellX(a.x),cellY(a.y),'#ffffff',2.0);
    shockRing(cellX(a.x),cellY(a.y),4.0*CELL,'#ff8c42',0.7);
    return;
  }

  const burstColor=a.alienType==='jumper'?'#9c27b0':a.alienType==='darkhopper'?'#c62828':a.alienType==='strong'?'#e53935':a.alienType==='darkflyer'?'#5c1a1a':a.alienType==='flyer'?'#457b9d':a.alienType==='intermediate'?'#26a69a':'#39d353';  burst(cellX(a.x),cellY(a.y),burstColor,1.3);
  shockRing(cellX(a.x),cellY(a.y),1.6*CELL,'#ff8c42',0.35);

  if(!purge){
    const cx=Math.round(a.x-0.5),cy=Math.round(a.y-0.5);
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy)continue;
      const c={x:cx+dx,y:cy+dy};
      if(!inGrid(c))continue;
      const s=grid[c.y][c.x];
      if(s)damageStruct(s,CFG.EXPLODE_DMG);
    }

    if(a.frozen>0 && turretLevels.FREEZE>=2){
      const fd=turretLevels.FREEZE>=3?2:1;
      for(const other of aliens){
        if(other===a || other.state==='dying')continue;
        if(Math.hypot(other.x-a.x,other.y-a.y)<=1.5){
          damageAlien(other,fd);
        }
      }
      burst(cellX(a.x),cellY(a.y),'#4fc3f7',1.2);
      shockRing(cellX(a.x),cellY(a.y),1.5*CELL,'#4fc3f7',0.35);
    }
  }
}

function updateTurrets(dt){
  const mx=(mouse.x-GX0)/CELL,my=(mouse.y-GY0)/CELL;
  for(const s of turrets.slice()){
    s.cool-=dt;
    const tt=s.turretType||'BASIC';
    if(selection&&selection.kind==='turret'&&selection.ref===s&&tt!=='MINE'){
      const want=Math.atan2(my-(s.r+0.5),mx-(s.c+0.5));
      s.angle=angNorm(s.angle+clamp(angNorm(want-s.angle),-6*dt,6*dt));
      s.barrel.setAttribute('transform',`rotate(${s.angle*180/Math.PI})`);
    }
    if(phase!=='attack')continue;

    if(tt==='FLAME'){
      s.flameDmgCool-=dt;
      if(s.flameDmgCool<0)s.flameDmgCool=0;
    }

    const cx=s.c+0.5,cy=s.r+0.5;

    if(tt==='MINE'){
      for(const a of aliens){
        if(a.state==='dying'||a.alienType==='boss'||a.alienType==='darkboss'||a.alienType==='darkheart')continue;
        if(Math.hypot(a.x-cx,a.y-cy)<=CFG.MINE_TRIGGER){
          explodeMine(s);
          break;
        }
      }
      continue;
    }

    const flameRange=2.5*(turretLevels.FLAME>=2?1.5:1);
    const range=tt==='SNIPER'?CFG.BULLET_RANGE*2.5:tt==='HOMING'?CFG.BULLET_RANGE*1.5:tt==='FLAME'?flameRange:CFG.BULLET_RANGE;

    if(tt==='SNIPER'&&s.beamEl){
      const bx=CELL/2+Math.cos(s.angle)*range*CELL,by=CELL/2+Math.sin(s.angle)*range*CELL;
      s.beamEl.setAttribute('x2',bx);s.beamEl.setAttribute('y2',by);
      const aboutToFire=s.cool<0.15;
      s.beamEl.setAttribute('opacity',aboutToFire?0.6:0.15);
      s.beamEl.setAttribute('stroke',aboutToFire?'#fff':'#9c27b0');
    }

    if((tt==='FREEZE'||tt==='FLAME')&&s.freezeEl){
      if(s.cool<=0){
        s.cool=0.08;
        let hasTarget = turretHasTarget(s);
        if (!hasTarget && tt === 'FLAME') hasTarget = flameHasProjTarget(cx, cy, range, s.angle);
        if(hasTarget){
          const nowMs=performance.now();
          if(!s.lastFreezeSfx || nowMs - s.lastFreezeSfx > 400) {
            SFX.play(tt==='FREEZE'?'freeze':'flame');
            s.lastFreezeSfx = nowMs;
          }
          s.freezeEl.setAttribute('opacity',0.6);

          for(let p=0;p<3;p++){
            const ang=s.angle+(Math.random()-0.5)*(Math.PI/6);
            const spd=CELL*(tt==='FLAME'?(2.0+Math.random()*1.8):(2.2+Math.random()*2.2));
            const px=cx+Math.cos(ang)*0.35,py=cy+Math.sin(ang)*0.35;
            const vx=Math.cos(ang)*spd,vy=Math.sin(ang)*spd;
            const fillC=tt==='FLAME'?pick(['#ff9d00','#ff5722','#ffd166']):'#dff3ff';
            const strokeC=tt==='FLAME'?'#ff6b00':'#ffffff';
            const pg=el('circle',{cx:cellX(px),cy:cellY(py),r:CELL*0.05,fill:fillC,stroke:strokeC,'stroke-width':1,opacity:0.4},fxG);
            fx.push({el:pg,x:cellX(px),y:cellY(py),vx,vy,t:0,dur:tt==='FLAME'?0.5:0.7,ice:true,r0:CELL*0.05,r1:CELL*(0.22+Math.random()*0.12)});
          }

          if(tt==='FREEZE'){
            for(const a of aliens){
              if(a.state==='dying'||a.alienType==='boss'||a.alienType==='darkboss'||a.alienType==='darkheart')continue;
              const dx=a.x-cx,dy=a.y-cy,dist=Math.hypot(dx,dy);
              if(dist>range)continue;
              const angToAlien=Math.atan2(dy,dx);
              const diff=Math.abs(angNorm(angToAlien-s.angle));
              if(diff<0.4){a.frozen=0.5;}
            }
            for(const c of tankCannonballs){
              const dx=c.x-cx,dy=c.y-cy,dist=Math.hypot(dx,dy);
              if(dist>range)continue;
              if(Math.abs(angNorm(Math.atan2(dy,dx)-s.angle))<0.4)c.frozen=Math.max(c.frozen,0.5);
            }
            for(const sh of dhShots){
              const dx=sh.x-cx,dy=sh.y-cy,dist=Math.hypot(dx,dy);
              if(dist>range)continue;
              if(Math.abs(angNorm(Math.atan2(dy,dx)-s.angle))<0.4)sh.frozen=Math.max(sh.frozen,0.5);
            }
          } else {
            if (s.flameDmgCool <= 0) {
              let hitAny = false;
              const flameDmg = turretLevels.FLAME >= 3 ? 2 : 1;
              // aliens AND bosses (damageAlien handles vulnerability / turret-form routing)
              for (const a of aliens) {
                if (a.state === 'dying') continue;
                const dx = a.x - cx, dy = a.y - cy, dist = Math.hypot(dx, dy);
                const bigR = (a.alienType === 'darkheart') ? DARKHEART_RADIUS
                           : (a.alienType === 'boss' || a.alienType === 'darkboss' || a.alienType === 'tank') ? BOSS_RADIUS : 0;
                if (dist - bigR > range) continue;
                const angToAlien = Math.atan2(dy, dx);
                const diff = Math.abs(angNorm(angToAlien - s.angle));
                const tol = 0.4 + (bigR > 0 ? Math.atan2(bigR, Math.max(dist, 0.01)) : 0);
                if (diff < tol) {
                  damageAlien(a, flameDmg);
                  hitAny = true;
                }
              }
              // dark heart shots
              for (let si = dhShots.length - 1; si >= 0; si--) {
                const sh = dhShots[si];
                const dx = sh.x - cx, dy = sh.y - cy;
                if (Math.hypot(dx, dy) > range) continue;
                if (Math.abs(angNorm(Math.atan2(dy, dx) - s.angle)) < 0.4) {
                  sh.hp -= flameDmg;
                  hitAny = true;
                  if (sh.hp <= 0) {
                    burst(cellX(sh.x), cellY(sh.y), '#5c0000', 1.2);
                    sh.el.remove(); dhShots.splice(si, 1);
                  }
                }
              }
              // tank cannonballs
              for (let ci = tankCannonballs.length - 1; ci >= 0; ci--) {
                const cb = tankCannonballs[ci];
                const dx = cb.x - cx, dy = cb.y - cy;
                if (Math.hypot(dx, dy) > range) continue;
                if (Math.abs(angNorm(Math.atan2(dy, dx) - s.angle)) < 0.4) {
                  cb.hp -= flameDmg;
                  hitAny = true;
                  if (cb.hp <= 0) {
                    burst(cellX(cb.x), cellY(cb.y), '#ff8c42', 1.5);
                    cb.el.remove(); tankCannonballs.splice(ci, 1);
                  }
                }
              }
              if (hitAny) s.flameDmgCool = 0.4;
            }
          }

          s.hp-=0.08;
          if(s.hp<=0){destroyStruct(s);continue;}
        }else{
          s.freezeEl.setAttribute('opacity',0);
        }
      }
    }

    if(s.cool>0)continue;
    if(!turretHasTarget(s))continue;

    if(tt==='BASIC'){
      s.cool=CFG.TURRET_RATE;
      const dx=Math.cos(s.angle),dy=Math.sin(s.angle);
      bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'BASIC',dmg:1,el:el('circle',{r:0.09*CELL,fill:'#111'},bulletG)});
      SFX.play('shoot');
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }else if(tt==='SNIPER'){
      s.cool=CFG.TURRET_RATE*(turretLevels.SNIPER>=2?1:2);
      if(s.beamEl){s.beamEl.setAttribute('stroke','#fff');s.beamEl.setAttribute('opacity',0.9);}
      const dx=Math.cos(s.angle),dy=Math.sin(s.angle);
      bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'SNIPER',dmg:3,el:el('circle',{r:0.06*CELL,fill:'#9c27b0'},bulletG)});
      SFX.play('shoot');
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }else if(tt==='HOMING'){
      s.cool=CFG.TURRET_RATE;
      const homingLevel=turretLevels.HOMING;
      const offsets=homingLevel>=3?[0,Math.PI*2/3,-Math.PI*2/3]:homingLevel>=2?[0,Math.PI]:[0];
      for(const off of offsets){
        const ang=s.angle+off;
        const dx=Math.cos(ang),dy=Math.sin(ang);
        const mg=el('g',{},bulletG);
        el('polygon',{points:`0,-3 8,0 0,3`,fill:'#ff6f00',stroke:'#111','stroke-width':0.5,transform:`scale(${CELL*0.04})`},mg);
        bullets.push({x:cx+dx*0.42,y:cy+dy*0.42,dx,dy,dist:0,type:'HOMING',dmg:1,el:mg});
      }
      SFX.play('homing');
      s.hp-=1;if(s.hp<=0)destroyStruct(s);
    }
  }
}

function distSqToSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const l2=dx*dx+dy*dy;
  if(l2===0){
    const ddx=px-x1,ddy=py-y1;
    return ddx*ddx+ddy*ddy;
  }
  let t=((px-x1)*dx+(py-y1)*dy)/l2;
  t=clamp01(t);
  const cx=x1+t*dx,cy=y1+t*dy;
  const ddx=px-cx,ddy=py-cy;
  return ddx*ddx+ddy*ddy;
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const speed=b.type==='HOMING'?CFG.BULLET_SPEED*0.8:b.type==='SNIPER'?CFG.BULLET_SPEED*3:CFG.BULLET_SPEED;
    const maxRange=b.type==='SNIPER'?CFG.BULLET_RANGE*2.5:b.type==='HOMING'?CFG.BULLET_RANGE*1.5:CFG.BULLET_RANGE;
    const dmg=b.dmg||1;

    if(b.type==='HOMING'){
      let bestDist=Infinity,bestA=null;
      for(const a of aliens){if(a.state==='dying')continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bestDist){bestDist=d;bestA=a;}}
      if(bestA){
        const want=Math.atan2(bestA.y-b.y,bestA.x-b.x);
        const cur=Math.atan2(b.dy,b.dx);
        const steer=angNorm(want-cur);
        const newAng=cur+clamp(steer,-4*dt,4*dt);
        b.dx=Math.cos(newAng);b.dy=Math.sin(newAng);
      }
    }

    const oldX=b.x,oldY=b.y;
    let step=speed*dt;
    const remaining=maxRange-b.dist;
    if(step>remaining)step=Math.max(0,remaining);

    b.x+=b.dx*step;
    b.y+=b.dy*step;
    b.dist+=step;

    let dead=false;

    for(const a of aliens){
      if(a.state==='dying')continue;
      const hitR = (a.alienType === 'boss' || a.alienType === 'tank' || a.alienType === 'darkboss') ? BOSS_RADIUS
                 : (a.alienType === 'darkheart') ? DARKHEART_RADIUS : CFG.ALIEN_HIT_RADIUS;
      const hitR2=hitR*hitR;
      let hit=false;
      if(b.type==='SNIPER'){
        hit=distSqToSegment(a.x,a.y,oldX,oldY,b.x,b.y)<hitR2;
      }else{
        const dx=a.x-b.x,dy=a.y-b.y;
        hit=(dx*dx+dy*dy)<hitR2;
      }
      if(hit){
        const killed=damageAlien(a,dmg);
        bulletHitFlicker(cellX(b.x),cellY(b.y));
        if(b.type==='SNIPER' && turretLevels.SNIPER>=3 && !b.pierced && killed){
          b.pierced=true;
          continue;
        }
        dead=true;
        break;
      }
    }

    if(!dead && b.dist>=maxRange)dead=true;

    if(dead){
      b.el.remove();bullets.splice(i,1);continue;
    }

    if(b.type==='HOMING'){
      const ang=Math.atan2(b.dy,b.dx);
      b.el.setAttribute('transform',`translate(${cellX(b.x)} ${cellY(b.y)}) rotate(${ang*180/Math.PI})`);
    }else{
      b.el.setAttribute('cx',cellX(b.x));b.el.setAttribute('cy',cellY(b.y));
    }
  }
}

}

function updateFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;if(f.t>=f.dur){f.el.remove();fx.splice(i,1);continue;}const p=f.t/f.dur;if(f.ring){f.el.setAttribute('r',f.maxR*easeOutCubic(p));f.el.setAttribute('opacity',1-p);}else if(f.grow){f.el.setAttribute('r',f.maxR*easeOutCubic(p));f.el.setAttribute('opacity',String(0.45*(1-p)));}else if(f.debris){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt;f.rot+=f.rotV*dt;f.el.setAttribute('transform',`translate(${f.x} ${f.y}) rotate(${f.rot})`);f.el.setAttribute('opacity',1-p);}else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.el.setAttribute('cx',f.x);f.el.setAttribute('cy',f.y);if(f.ice){const r=f.r0+(f.r1-f.r0)*easeOutCubic(p);f.el.setAttribute('r',r);f.el.setAttribute('opacity',String(0.35*(1-p*p)));}else{f.el.setAttribute('opacity',1-p);}}}}

function updateTooltip(){
  if(phase==='intro'||phase==='exit'||heartDead){hideTooltip();return;}
  if(phase==='place'&&G.choices.length>0&&choicesG._op>0.5){
    let hovIdx=-1;
    for(let i=0;i<G.choices.length;i++){
      const c=G.choices[i];
      if(mouse.x>=c.x0&&mouse.x<=c.x1&&Math.abs(mouse.y-CHOICE.y)<=c.half){hovIdx=i;break;}
    }
    if(hovIdx>=0){
      const c=G.choices[hovIdx];
      const tIdx=c.types?c.types.indexOf('TURRET'):-1;
      if(tIdx>=0 && c.turretTypes && c.turretTypes[tIdx]){
        const tt=c.turretTypes[tIdx];
        const newKey='choice_'+tt;
        if(newKey!==choiceTooltipKey){
          choiceTooltipKey=newKey;tipKey='';
          tooltipG.textContent='';
          const lines=[tt,...wrapText((TURRET_INFO[tt]||'').toUpperCase(),32)];
          const scale=1.0,lineH=LH*scale+4,padX=11,padY=8;
          let maxW=0;
          const built=lines.map(ln=>{const t=buildText(ln,scale,2,'#111');maxW=Math.max(maxW,t.w);return t;});
          const pw=maxW+padX*2,ph=built.length*lineH+padY*2-4;
          let px=clamp(c.slotX-pw/2,8,D-8-pw);
          let py=CHOICE.y+c.half+12;
          if(py+ph>D-8)py=CHOICE.y-c.half-12-ph;
          el('rect',{x:px,y:py,width:pw,height:ph,rx:6,fill:'#fff',stroke:'#111','stroke-width':1.5},tooltipG);
          built.forEach((t,i)=>{t.g.setAttribute('transform',`translate(${px+padX} ${py+padY+i*lineH})`);tooltipG.appendChild(t.g);});
          tooltipG.setAttribute('opacity',1);
        }
        hoverG.setAttribute('opacity',0);
        return;
      }
    }
    if(choiceTooltipKey!==''){choiceTooltipKey='';tooltipG.setAttribute('opacity',0);}
  }
  let data=null;
  if(mouse.cell&&inGrid(mouse.cell)){
    const s=grid[mouse.cell.y][mouse.cell.x];
    let lootUC=null;
    for(const uc of upgradeContainers){
      if(!uc.collected&&uc.cell.x===mouse.cell.x&&uc.cell.y===mouse.cell.y){
        lootUC=uc;break;
      }
    }
    if(lootUC){
      data={c:mouse.cell,isLoot:true,lootUC};
    }else if(s){
      data={c:mouse.cell,hp:s.hp,max:s.maxHp,isHeart:false};
    }else if(mouse.cell.x===HEART.x&&mouse.cell.y===HEART.y){
      data={c:mouse.cell,hp:heartHp,max:CFG.HEART_HP,isHeart:true};
    }
  }
  if(!data){hideTooltip();if(phase!=='place'&&phase!=='preAttack')svg.style.cursor='default';return;}
  if(data.isLoot){
    const uc=data.lootUC;
    const key='loot_'+data.c.x+'_'+data.c.y;
    if(key!==tipKey){
      tipKey=key;choiceTooltipKey='';tooltipG.textContent='';
      let lines;
      if(uc.mode==='upgrade'){
        lines=['BUILD ADJACENT TO LOOT.',uc.upgradeType+' LV '+uc.upgradeLevel,...wrapText(upgradeDescription(uc.upgradeType,uc.upgradeLevel),24)];
      }else{
        lines=['BUILD ADJACENT TO LOOT.',...uc.rewards];
      }
      const scale=1.0,lineH=LH*scale+4,padX=11,padY=8;
      let maxW=0;
      const built=lines.map(ln=>{const t=buildText(ln.toUpperCase(),scale,2,'#111');maxW=Math.max(maxW,t.w);return t;});
      const pw=maxW+padX*2,ph=built.length*lineH+padY*2-4;
      let px=cellX(data.c.x)+CELL/2-pw/2;
      let py=cellY(data.c.y)-ph-8;
      if(py<4)py=cellY(data.c.y)+CELL+8;
      el('rect',{x:px,y:py,width:pw,height:ph,rx:6,fill:'#fff',stroke:'#111','stroke-width':1.5},tooltipG);
      built.forEach((t,i)=>{t.g.setAttribute('transform',`translate(${px+padX} ${py+padY+i*lineH})`);tooltipG.appendChild(t.g);});
      tooltipG.setAttribute('opacity',1);
      hoverRect.setAttribute('x',cellX(data.c.x)+1.5);hoverRect.setAttribute('y',cellY(data.c.y)+1.5);hoverRect.setAttribute('width',CELL-3);hoverRect.setAttribute('height',CELL-3);hoverG.setAttribute('opacity',1);
    }
    return;
  }
  if(phase!=='place'&&phase!=='preAttack'){const st=grid[data.c.y][data.c.x];svg.style.cursor=(st&&st.type==='TURRET')||(data.isHeart)?'pointer':'default';}
  const key=data.c.x+','+data.c.y+','+Math.round(data.hp);
  if(key!==tipKey){tipKey=key;choiceTooltipKey='';tooltipG.textContent='';const label=`${Math.max(0,Math.round(data.hp/data.max*100))}%`;const txt=buildText(label,1.05,2.2,'#111');const pw=txt.w+22,ph=40,px=cellX(data.c.x)+CELL/2-pw/2;let py=cellY(data.c.y)-ph-8;if(py<4)py=cellY(data.c.y)+CELL+8;el('rect',{x:px,y:py,width:pw,height:ph,rx:6,fill:'#fff',stroke:'#111','stroke-width':1.5},tooltipG);txt.g.setAttribute('transform',`translate(${px+11} ${py+7})`);tooltipG.appendChild(txt.g);el('rect',{x:px+11,y:py+26,width:pw-22,height:6,fill:'none',stroke:'#111','stroke-width':1.2},tooltipG);el('rect',{x:px+11,y:py+26,width:(pw-22)*clamp01(data.hp/data.max),height:6,fill:'#ff2140'},tooltipG);tooltipG.setAttribute('opacity',1);hoverRect.setAttribute('x',cellX(data.c.x)+1.5);hoverRect.setAttribute('y',cellY(data.c.y)+1.5);hoverRect.setAttribute('width',CELL-3);hoverRect.setAttribute('height',CELL-3);hoverG.setAttribute('opacity',1);}
}
function startWave(n){
  G.wave=n;phase='banner';
  const isBoss=(n%5===0);
  const bannerStr=(n===20)?'WAVE 20 : FINAL BOSS':(isBoss?('WAVE '+n+' : BOSS'):'WAVE '+n);
  showBanner(bannerStr,startPlacement);
  SFX.play(isBoss?'bossChime':'waveChime');
}
function fullRestart(){
  for(const s of structures)s.el.remove();structures.length=0;turrets.length=0;
  for(const a of aliens)a.art.g.remove();aliens.length=0;
  for(const b of bullets)b.el.remove();bullets.length=0;
  for(const b of ebullets)b.el.remove();ebullets.length=0;
  for(const p of projectiles)p.el.remove();projectiles.length=0;
  for(const h of greenHearts)h.el.remove();greenHearts.length=0;
  for(const g of G.gates)g.el.remove();
  fxG.textContent='';fx.length=0;darkG.textContent='';projG.textContent='';
  hsGhostG.textContent='';hsGhostG.setAttribute('opacity',0);
  heartBreakG.textContent='';heartBreakG.setAttribute('opacity',0);breakActive=false;
  toastG.textContent='';toasts.length=0;dmgNums.length=0;
  for(let y=0;y<GRID_N;y++)for(let x=0;x<GRID_N;x++)grid[y][x]=null;
  ghostG.textContent='';ghostG.setAttribute('transform','');
  choicesG.textContent='';choicesG.style.display='none';
  instrG.textContent='';instrG.style.display='none';instr.state='gone';
  bannerG.textContent='';banner=null;tooltipG.textContent='';hideTooltip();
  upgradeContainersG.textContent='';upgradeContainers=[];turretPoolG.textContent='';
  bossHudG.textContent='';bossHudG.setAttribute('opacity',0);
  selection=null;G=freshG();attackElapsed=0;aliensKilled=0;
  heartHp=CFG.HEART_HP;heartDead=false;heartShake=0;heartInvincible=false;cheatStartWave=1;
  heartshots=CFG.HEARTSHOT_START;gameStarted=false;drawHeartshotsHUD();
  boss=null;heartSelectCool=0;choiceRot=0;bossesDefeated=0;screenShake=0;placementsPerWave=3;turretAdjacencyRemoved=false;winT=0;for(const c of tankCannonballs)c.el.remove();tankCannonballs.length=0;
  for(const s of dhShots)s.el.remove();dhShots.length=0;
  turretLevels={FLAME:1,FREEZE:1,SNIPER:1,HOMING:1,MINE:1};
  heartP.setAttribute('fill','#ff2140');heartP.setAttribute('stroke','#d40f33');
  heartG.setAttribute('opacity',0);
  fadeRect.setAttribute('opacity',0);selRing.setAttribute('opacity',0);
  goScreen.setAttribute('opacity',0);goPhase='hidden';
  if(cheatMode){
    turretPool={BASIC:4,FLAME:4,FREEZE:4,SNIPER:4,HOMING:4,MINE:4};
  }else{
    turretPool={BASIC:4,FLAME:0,FREEZE:0,SNIPER:0,HOMING:0,MINE:0};
  }
  titleG.style.display='';btn.style.display='';svg.style.cursor='default';
  t0=performance.now()/1000;lastT=0;phase='intro';
  lastBeatIdx = -1;
  titleChimePlayed = false;
}
svg.addEventListener('pointermove',e=>{const p=evtDesign(e);mouse.x=p.x;mouse.y=p.y;mouse.cell=pixelToCell(mouse.x,mouse.y);updateHSGhost();if(phase==='attack'&&selection&&selection.kind==='heart'&&heartshots>=1){svg.style.cursor=hsAnchorCell(mouse.x,mouse.y)?'crosshair':'default';}});
svg.addEventListener('pointerdown',e=>{
    SFX.init();
    if(heartDead)return;if(e.button!==0)return;const p=evtDesign(e);mouse.x=p.x;mouse.y=p.y;mouse.cell=pixelToCell(mouse.x,mouse.y);if(phase==='attack'&&selection&&selection.kind==='heart'&&heartshots>=1){const ha=hsAnchorCell(mouse.x,mouse.y);if(ha){launchHeartshot(ha.x,ha.y);return;}selection=null;return;}if(phase==='place'){
      if(G.choices.length>0&&choicesG._op>0){
        for(let i=0;i<G.choices.length;i++){const c=G.choices[i];if(mouse.x>=c.x0&&mouse.x<=c.x1&&Math.abs(mouse.y-CHOICE.y)<=c.half){
            if(c.isRotate){rotateChoicePreviews(1);if(G.piece)rotatePiece(1);return;}
            selectChoice(i);return;
          }}
      }
    }if(phase==='place'||phase==='attack'||phase==='inter'||phase==='preAttack'){const cell=pixelToCell(mouse.x,mouse.y);if(!cell){selection=null;return;}const s=grid[cell.y][cell.x];const onHeart=cell.x===HEART.x&&cell.y===HEART.y;if(s&&s.type==='TURRET')selection={kind:'turret',ref:s};else if(onHeart){selection=heartSelectCool<=0?{kind:'heart'}:null;}else selection=null;}});
window.addEventListener('pointerup', e => {
    const p = evtDesign(e);
    mouse.x = p.x;
    mouse.y = p.y;
    mouse.cell = pixelToCell(mouse.x, mouse.y);

    if (phase === 'place' && G.piece && G.pause <= 0) {
      if (e.clientX < 0 || e.clientY < 0 || e.clientX > window.innerWidth || e.clientY > window.innerHeight) {
        G.piece = null;
        hideGhost();
        return;
      }
      let overChoice = false;
      if (G.choices.length > 0 && choicesG._op > 0) {
        for (let i = 0; i < G.choices.length; i++) {
          const c = G.choices[i];
          if (mouse.x >= c.x0 && mouse.x <= c.x1 && Math.abs(mouse.y - CHOICE.y) <= c.half) {
            overChoice = true; break;
          }
        }
      }
      if (!overChoice) {
        commitPiece();
      }
    }
  });
addEventListener('keydown',e=>{
    if (e.key === 'C' && e.shiftKey && phase==='intro' && !cheatMode) {
      cheatMode=true;
      cheatStartWave=20;
      heartInvincible=true;
      createToastAt(['CHEAT MODE: START WAVE '+cheatStartWave],D/2,D/2,1.0);
    }
    if((e.key==='c'||e.key==='C')&&phase==='intro'&&!cheatMode){
      cheatMode=true;
      createToastAt(['CHEAT MODE'],D/2,D/2,1.0);
    }
    if(e.key==='Escape'){selection=null;G.piece=null;hideGhost();return;}if(heartDead)return;if(phase!=='place')return;if(e.key==='ArrowLeft'||e.key==='ArrowUp'){rotateChoicePreviews(-1);if(G.piece)rotatePiece(-1);e.preventDefault();}if(e.key==='ArrowRight'||e.key==='ArrowDown'){rotateChoicePreviews(1);if(G.piece)rotatePiece(1);e.preventDefault();}});

addEventListener('wheel',e=>{if(heartDead)return;if(phase!=='place')return;const dir=e.deltaY>0?1:-1;rotateChoicePreviews(dir);if(G.piece)rotatePiece(dir);e.preventDefault();},{passive:false});

btn.addEventListener('click',()=>{
    SFX.init();
    if(phase!=='intro')return;if(performance.now()/1000-t0<4.1)return;gameStarted=true;
    if(cheatMode){
      turretPool={BASIC:4,FLAME:4,FREEZE:4,SNIPER:4,HOMING:4,MINE:4};
    }
    drawHeartshotsHUD();phase='exit';tClick=performance.now()/1000-t0;snap={hx:HEART_TITLE.x,hy:HEART_TITLE.y,s:HEART_TITLE.big};letterMeta.forEach((m,idx)=>{m.exitDelay=idx*0.028;m.exitDur=0.5+((idx*13)%5)*0.04;m.yTo=-(LH*TL+60+m.i*10);});spawnUpgradeContainers();});
btn.addEventListener('pointerenter',()=>{btnHover=true;setBtnStyle();});
btn.addEventListener('pointerleave',()=>{btnHover=false;btnPress=false;setBtnStyle();});
btn.addEventListener('pointerdown',()=>{btnPress=true;});btn.addEventListener('pointerup',()=>{btnPress=false;});
btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();btn.click();}});
goBtn.addEventListener('click',()=>{if(goPhase==='idle'){goPhase='fadeOut';goT=0;}});
goBtn.addEventListener('pointerenter',()=>{goBtnHover=true;if(goBtnRect){goBtnRect.setAttribute('fill','#ff2140');}if(goBtnText){goBtnText.setAttribute('stroke','#000');}});
goBtn.addEventListener('pointerleave',()=>{goBtnHover=false;if(goBtnRect){goBtnRect.setAttribute('fill','#1a0005');}if(goBtnText){goBtnText.setAttribute('stroke','#ff2140');}});
goBtn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(goPhase==='idle'){goPhase='fadeOut';goT=0;}}});
addEventListener('resize',fitViewport);
let lastLuma=-1;
function setBg(l){l=Math.round(l);if(l!==lastLuma){lastLuma=l;bg.setAttribute('fill',`rgb(${l},${l},${l})`);}}
function drawTitleIntro(t){const amp=TL*0.45;for(const m of letterMeta){const p=clamp01((t-m.delay)/m.dur),e=easeOutCubic(p),y=lerp(m.yFrom,m.cy,e);m.el.setAttribute('opacity','1');m.el.setAttribute('transform',`translate(${m.cx+amp*Math.sin(t*0.9+m.i*1.7)*e} ${y+amp*0.6*Math.sin(t*0.6+m.i*0.9+2)*e}) scale(${TL*(1+0.055*hb(t-m.i*0.015))}) translate(-5 -7)`);}}
function drawTitleExit(t){let gone=true;for(const m of letterMeta){const pe=clamp01((t-tClick-m.exitDelay)/m.exitDur);if(pe<1)gone=false;m.el.setAttribute('opacity',String(clamp01(1-pe*pe*1.1)));m.el.setAttribute('transform',`translate(${m.cx} ${lerp(m.cy,m.yTo,easeInCubic(pe))}) scale(${TL}) translate(-5 -7)`);}return gone;}
function drawBtnIntro(t,beat){const bop=clamp01((t-4.1)/0.7),e=easeOutCubic(bop);btn.setAttribute('opacity',bop);btn.setAttribute('transform',`translate(${btn._x} ${btn._y+(1-e)*16}) scale(${(btnPress?0.94:1)*(1+0.022*beat*bop)})`);}
function frame(nowMs){
  const t=nowMs/1000-t0,dt=clamp(t-lastT,0,0.05);lastT=t;const beat=hb(t);
  if(heartSelectCool>0)heartSelectCool-=dt;

  const currentBeatIdx = Math.floor(t / BEAT);
  if ((phase === 'intro' || phase === 'exit') && beat > 0.8) {
    if (currentBeatIdx !== lastBeatIdx) {
      let vol = 0;
      if (phase === 'intro') {
        const gGrow = easeInOutCubic(clamp01((t-0.55)/3.75));
        vol = gGrow * 0.9;
      } else if (phase === 'exit') {
        const qRaw = (t-tClick)/1.35;
        const q = easeInOutCubic(clamp01(qRaw));
        vol = (1 - q) * 0.9;
      }
      if (vol > 0.01) {
        SFX.play('heartbeat', vol);
      }
      lastBeatIdx = currentBeatIdx;
    }
  }

  if (phase === 'intro' && t > 2.0 && !titleChimePlayed) {
    titleChimePlayed = true;
    SFX.play('titleChime');
  }

  let gOp=0,heartOp=0,hx=0,hy=0,hs=0;
  if(phase==='intro'){const gGrow=easeInOutCubic(clamp01((t-0.55)/3.75));setBg(255*gGrow);heartOp=clamp01((t-0.25)/1.0);hx=HEART_TITLE.x;hy=HEART_TITLE.y;hs=lerp(HEART_TITLE.small,HEART_TITLE.big,gGrow)*(1+PULSE_AMP*beat);drawTitleIntro(t);drawBtnIntro(t,beat);}
  else if(phase==='exit'){setBg(255);const qRaw=(t-tClick)/1.35,q=easeInOutCubic(clamp01(qRaw));gOp=0.15*easeOutCubic(clamp01((t-tClick)/0.9));hx=lerp(snap.hx,HEART_CELL_PX.x,q);hy=lerp(snap.hy,HEART_CELL_PX.y,q);hs=lerp(snap.s,HEART_CELL_SCALE,q)*(1+PULSE_AMP*beat);heartOp=1;const gone=drawTitleExit(t),bop=clamp01(1-(t-tClick)/0.3);btn.setAttribute('opacity',bop);if(bop<=0)btn.style.display='none';if(qRaw>=1&&gone){phase='waiting';titleG.style.display='none';G.timer=0.3;}}
  else if(phase==='win'){
    setBg(255);gOp=0.15;winT+=dt;
    const p=easeInOutCubic(clamp01(winT/2.0));
    hs=lerp(HEART_CELL_SCALE,HEART_TITLE.big,p);hx=lerp(HEART_CELL_PX.x,HEART_TITLE.x,p);hy=lerp(HEART_CELL_PX.y,HEART_TITLE.y,p);
    heartOp=1;heartP.setAttribute('fill','#ff2140');heartP.setAttribute('stroke','#d40f33');
    haloP.setAttribute('opacity',(0.10+0.09*beat).toFixed(3));
    if(winT>=2.0&&goPhase==='hidden')showWinScreen(aliensKilled);
    updateGameOver(dt);
  }
  else if(phase==='over'){
    setBg(255);gOp=0.15;heartOp=0;
    hx=HEART_CELL_PX.x;hy=HEART_CELL_PX.y;hs=HEART_CELL_SCALE*0.92;
    heartP.setAttribute('fill','#8a8a8a');heartP.setAttribute('stroke','#666');haloP.setAttribute('opacity',0);
    overT+=dt;updateHeartBreak(dt);
    fadeRect.setAttribute('opacity',clamp01((overT-0.3)/1.5));
    if(overT>=2.0&&goPhase==='hidden'){showGameOver(aliensKilled);}
    updateGameOver(dt);
  }
  else{
    setBg(255);gOp=0.15;heartOp=1;hx=HEART_CELL_PX.x;hy=HEART_CELL_PX.y;
    hs=HEART_CELL_SCALE*(1+PULSE_AMP*beat*(heartHp/CFG.HEART_HP));
    if(heartShake>0){heartShake-=dt;hx+=(Math.random()-0.5)*2.4;hy+=(Math.random()-0.5)*2.4;}
    heartP.setAttribute('fill','#ff2140');heartP.setAttribute('stroke','#d40f33');
    haloP.setAttribute('opacity',(0.10+0.09*beat*(heartHp/CFG.HEART_HP)).toFixed(3));
    if(phase==='waiting'){G.timer-=dt;if(G.timer<=0){drawHeartshotsHUD();startWave(cheatStartWave);}}
    else if(phase==='banner')updateBanner(dt);
    else if(phase==='place'){updatePlacement(dt);updateProjectiles(dt);}
    else if(phase==='preAttack'){updatePlacement(dt);updateProjectiles(dt);G.timer-=dt;if(G.timer<=0)startAttack();}
    else if(phase==='attack')updateAttack(dt,t);
    else if(phase==='inter'){updateBullets(dt);updateEBullets(dt);updateDarkHeartShots(dt);updateProjectiles(dt);updateGreenHearts(dt);G.timer-=dt;if(G.timer<=0)startWave(G.wave+1);}
    if(phase==='place'||phase==='preAttack'||phase==='attack'||phase==='inter'){updateTurrets(dt);updateSelRing(beat);}
  }
  updateFx(dt);updateToasts(dt);updateDmgNumbers(dt);updateTooltip();updateInstructions(dt);
  gridG.setAttribute('opacity',gOp);
  borderG.setAttribute('opacity',gOp);
  heartG.setAttribute('opacity',heartOp);
  heartG.setAttribute('transform',`translate(${hx} ${hy}) scale(${hs})`);

  let shx=0,shy=0;
  if(screenShake>0){
    screenShake-=dt;
    shx=(Math.random()-0.5)*18;
    shy=(Math.random()-0.5)*18;
  }
  world.setAttribute('transform',`translate(${view.ox+shx} ${view.oy+shy}) scale(${view.k})`);

  requestAnimationFrame(frame);
}
buildTitle();buildGridLines();buildBtn();buildGameOverScreen();fitViewport();drawHeartshotsHUD();requestAnimationFrame(frame);
